[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "api-bridge-health-demo"
version = "1.0.0"
description = "FastAPI bridge pattern with health, readiness, metrics, bounded upstream reads, and evidence."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Rien Regalado"}]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "prometheus-client>=0.21,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
