name: Bug report
description: Report a reproducible defect in the synthetic demonstration.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, private endpoints, customer data, or production logs.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use synthetic inputs only.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Repository revision or release
